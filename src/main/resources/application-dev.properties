spring.application.name=task-management-dev

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=thuctap;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwtSecret=mySecretKeyForJWTTokenGenerationAndValidation2024
app.jwtExpirationMs=86400000

logging.level.com.tu00128.taskmgmt=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG